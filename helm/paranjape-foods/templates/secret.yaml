apiVersion: v1
kind: Secret
metadata:
  name: {{ include "paranjape-foods.fullname" . }}-secrets
  labels:
    {{- include "paranjape-foods.labels" . | nindent 4 }}
type: Opaque
stringData:
  MONGODB_URI: {{ .Values.secrets.mongodbUri | quote }}
  MANAGER_PASSCODE: {{ .Values.secrets.managerPasscode | quote }}
  DELIVERY_PASSCODE: {{ .Values.secrets.deliveryPasscode | quote }}
  GOOGLE_GEOCODING_API_KEY: {{ .Values.secrets.googleGeocodingApiKey | quote }}
  RAZORPAY_KEY_ID: {{ .Values.secrets.razorpayKeyId | quote }}
  RAZORPAY_KEY_SECRET: {{ .Values.secrets.razorpayKeySecret | quote }}
